; PlatformIO Project Configuration File

[platformio]
default_envs = esp32dev, nodemcuv2

; ==========================================
; 1. NODO CENTRAL (ESP32 - Sensores Offline)
; ==========================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_src_filter = -<*> +<main_esp32.cpp>

lib_deps = 
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ==========================================
; 2. NODO HMI (NodeMCU ESP8266 - DSKY)
; ==========================================
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
build_src_filter = -<*> +<main_nodemcu.cpp>

lib_deps = 
    tobiasschuerg/ESP8266 Influxdb@^3.13.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4